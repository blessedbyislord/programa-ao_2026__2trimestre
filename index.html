<script>
        let codigoGerado = null;
        let emailParaReset = '';
        let inicioExecutado = false;

        // 1. GERENCIAMENTO DE MODO ESCURO
        function alternarModoEscuro() {
            document.body.classList.toggle('dark-mode');
            const ehEscuro = document.body.classList.contains('dark-mode');
            localStorage.setItem('game_saber_theme', ehEscuro ? 'dark' : 'light');
            atualizarBotaoTema();
        }

        function atualizarBotaoTema() {
            const btn = document.getElementById('themeToggleBtn');
            if (btn) {
                const ehEscuro = document.body.classList.contains('dark-mode');
                btn.innerHTML = ehEscuro ? '☀️ Modo Claro' : '🌙 Modo Escuro';
            }
        }

        function carregarTemaSalvo() {
            const savedTheme = localStorage.getItem('game_saber_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.body.classList.add('dark-mode');
            }
            atualizarBotaoTema();
        }

        // 2. ANIMACÃO DA TELA INICIAL
        function iniciarSite() {
            if (inicioExecutado) return;
            inicioExecutado = true;

            const lamp = document.getElementById('splashLamp');
            const splash = document.getElementById('splashScreen');
            const btn = document.getElementById('btnComecar');

            if (btn) btn.style.pointerEvents = 'none';
            if (lamp) lamp.classList.add('crescer-explodir');

            criarExplosaoLampadas();

            setTimeout(() => {
                document.body.style.overflow = 'auto';
                if (splash) {
                    splash.classList.add('revelar-site');
                    setTimeout(() => splash.style.display = 'none', 800);
                }
            }, 650);
        }

        function criarExplosaoLampadas() {
            const splash = document.getElementById('splashScreen');
            if (!splash) return;

            for (let i = 0; i < 35; i++) {
                const particle = document.createElement('span');
                particle.classList.add('lamp-particle');
                particle.innerText = '💡';

                const angulo = Math.random() * Math.PI * 2;
                const distancia = 200 + Math.random() * 400;
                
                // FINALIZANDO A MATEMÁTICA DA EXPLOSÃO
                const dx = (Math.cos(angulo) * distancia) + 'px';
                const dy = (Math.sin(angulo) * distancia) + 'px';
                const rot = (Math.random() * 360) + 'deg';
                
                particle.style.setProperty('--dx', dx);
                particle.style.setProperty('--dy', dy);
                particle.style.setProperty('--rot', rot);
                
                splash.appendChild(particle);
            }
        }

        // 3. NAVEGAÇÃO POR ABAS
        function trocarAba(event, idAba) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(idAba).classList.add('active');
            if (event) event.currentTarget.classList.add('active');
        }

        // 4. MODAL DE LOGIN / AUTENTICAÇÃO
        function abrirModalAuth() {
            document.getElementById('authOverlay').classList.add('active');
        }

        function fecharModalAuth() {
            document.getElementById('authOverlay').classList.remove('active');
        }

        function mostrarFormAuth(idForm) {
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            document.getElementById(idForm).classList.add('active');
            
            // Gerencia os botões de aba dentro do modal, se clicados
            document.querySelectorAll('.auth-tab-btn').forEach(btn => btn.classList.remove('active'));
            if(event && event.currentTarget.classList.contains('auth-tab-btn')) {
                event.currentTarget.classList.add('active');
            }
        }

        // 5. FUNÇÕES DE SIMULAÇÃO DE LOGIN/CADASTRO
        function fazerLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            alert('Bem-vindo de volta, ' + email + '!');
            simularLogin(email);
        }

        function cadastrarUsuario(event) {
            event.preventDefault();
            const nome = document.getElementById('cadNome').value;
            alert('Conta criada com sucesso, ' + nome + '!');
            simularLogin(nome);
        }

        function solicitarCodigoReset(event) {
            event.preventDefault();
            alert('Código de 6 dígitos enviado para o seu e-mail!');
            mostrarFormAuth('formCodigoSenha');
        }

        function redefinirSenhaComCodigo(event) {
            event.preventDefault();
            alert('Senha redefinida com sucesso!');
            mostrarFormAuth('formLogin');
        }

        function simularLogin(nomeUsuario) {
            fecharModalAuth();
            document.getElementById('userInfoText').innerText = 'Logado como: ' + nomeUsuario;
            
            const btn = document.getElementById('userBarBtn');
            btn.innerText = 'Sair';
            btn.classList.add('btn-logout');
            btn.onclick = () => {
                alert('Você saiu da sua conta.');
                document.getElementById('userInfoText').innerText = 'Modo Convidado (Navegação Livre)';
                btn.innerText = 'Fazer Login';
                btn.classList.remove('btn-logout');
                btn.onclick = abrirModalAuth;
            };
        }

        // INICIALIZAÇÃO
        window.onload = () => {
            carregarTemaSalvo();
        };
    </script>
</body>
</html>
