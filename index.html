<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Site - Completo e Otimizado</title>
  
  <style>
    /* VARIÁVEIS DE COR E TEMAS */
    :root {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --border: #e2e8f0;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      --radius: 16px;
    }

    [data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    /* RESET E ESTILOS GERAIS */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* CABEÇALHO */
    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      font-size: 1.2rem;
      padding: 0.4rem 0.6rem;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background-color: var(--border);
    }

    /* CONTEÚDO PRINCIPAL */
    main {
      flex: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      width: 100%;
    }

    .hero {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin-bottom: 1rem;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 0.85rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
    }

    /* SEÇÃO MEU PERFIL */
    .profile-section {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      margin-bottom: 3rem;
      box-shadow: var(--shadow);
    }

    .profile-card {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }

    .profile-info h3 {
      font-size: 1.3rem;
    }

    .profile-info p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .badge {
      display: inline-block;
      margin-top: 0.4rem;
      padding: 0.2rem 0.6rem;
      background-color: rgba(99, 102, 241, 0.15);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 12px;
    }

    /* MODAL DE CONFIGURAÇÕES */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 200;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem 2rem;
      width: 90%;
      max-width: 400px;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .close-btn {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 0;
      border-top: 1px solid var(--border);
    }

    .setting-btn {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }

    /* RODAPÉ */
    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 2rem 1.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#" class="logo">✨ WebCraft</a>
      <nav class="nav-links">
        <a href="#perfil">Meu Perfil</a>
        <button class="icon-btn" id="settings-btn" title="Configurações">⚙️</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Bem-vindo de Volta</h1>
      <p>Acesse sua conta para visualizar seu painel completo.</p>
      <button class="btn-primary" id="cta-btn">Entrar</button>
    </section>

    <section class="profile-section" id="perfil">
      <div class="profile-card">
        <div class="avatar">👤</div>
        <div class="profile-info">
          <h3>Meu Perfil</h3>
          <p>usuario@email.com</p>
          <span class="badge">Conta Ativa</span>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="settings-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⚙️ Configurações</h3>
        <button class="close-btn" id="close-modal">&times;</button>
      </div>
      <div class="setting-item">
        <span>Aparência</span>
        <button class="setting-btn" id="theme-btn">🌙 Modo Escuro</button>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 WebCraft. Todos os direitos reservados.</p>
  </footer>

  <script>
    const settingsBtn = document.getElementById('settings-btn');
    const settingsModal = document.getElementById('settings-modal');
    const closeModal = document.getElementById('close-modal');
    const themeBtn = document.getElementById('theme-btn');

    settingsBtn.addEventListener('click', () => settingsModal.classList.add('active'));
    closeModal.addEventListener('click', () => settingsModal.classList.remove('active'));
    
    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) settingsModal.classList.remove('active');
    });

    const currentTheme = localStorage.getItem('theme');

    if (currentTheme) {
      document.documentElement.setAttribute('data-theme', currentTheme);
      themeBtn.textContent = currentTheme === 'dark' ? '☀️ Modo Claro' : '🌙 Modo Escuro';
    }

    themeBtn.addEventListener('click', () => {
      let theme = document.documentElement.getAttribute('data-theme');
      
      if (theme === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeBtn.textContent = '🌙 Modo Escuro';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeBtn.textContent = '☀️ Modo Claro';
      }
    });

    document.getElementById('cta-btn').addEventListener('click', () => {
      alert('Login efetuado com sucesso!');
    });
  </script>

</body>
</html>
