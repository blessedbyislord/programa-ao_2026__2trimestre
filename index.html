<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animação SVG</title>
  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Estilização da página para centralizar a animação */
    body {
      background-color: #020916;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Container para controlar o tamanho máximo do SVG */
    .hero-animation {
      width: 100%;
      max-width: 800px;
      padding: 20px;
    }

    .hero-animation svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
