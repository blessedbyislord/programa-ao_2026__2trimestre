<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME DO SABER - Colégio Estadual Roberto Langer Junior</title>

    <style>
        /* ==========================================
           1. ESTILOS BASE E RESETS
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #2c3e50;
            line-height: 1.6;
        }

        /* ==========================================
           1.1 TELA DE INÍCIO INTERATIVA (SPLASH SCREEN)
           ========================================== */
        .splash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0a0f1d 0%, #1b365d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: transform 0.6s ease, opacity 0.6s ease;
            text-align: center;
            padding: 20px;
            cursor: pointer;
        }

        .splash-overlay.revelar-site {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .splash-content {
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 2;
        }

        .splash-lamp-wrapper {
            position: relative;
            user-select: none;
        }

        .splash-lamp-icon {
            font-size: 6.5rem;
            filter: brightness(0.8) drop-shadow(0 0 15px rgba(251, 191, 36, 0.5));
            transition: transform 0.3s ease;
            display: inline-block;
        }

        .splash-title {
            color: #ffffff;
            font-size: 2.2rem;
            letter-spacing: 2px;
            font-weight: 800;
        }

        .splash-subtitle {
            color: #00d2ff;
            font-size: 1.05rem;
            margin-top: -10px;
        }

        .btn-comecar {
            background: linear-gradient(135deg, #00d2ff, #0284c7);
            color: #0f172a;
            border: none;
            padding: 16px 50px;
            font-size: 1.25rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.3);
            transition: all 0.3s ease;
            margin-top: 15px;
            text-transform: uppercase;
        }

        /* ==========================================
           2. HEADER E PISCA-PISCA
           ========================================== */
        @keyframes piscarLuz {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 15px #f59e0b); }
            50% { opacity: 0.4; filter: none; }
        }

        .lampada-pisca {
            display: inline-block;
            font-size: 2.2rem;
            animation: piscarLuz 2.5s infinite ease-in-out;
            margin: 0 10px;
            vertical-align: middle;
        }

        /* ==========================================
           3. OVERLAY DE LOGIN / CADASTRO
           ========================================== */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.85);
